name: release

# a tag like v1.2.3 builds the CLI for linux, darwin and windows on amd64 and
# arm64, signs sha256sums.txt with the release key, attests the files and
# publishes them with sha256sums.txt and its signature, the names
# are the ones install.sh and the packages look for
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # the release itself, and the keyless signature of the files
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # a tag on a commit that does not pass its tests publishes nothing
      - name: tests
        env:
          CGO_ENABLED: "0"
        run: go test -tags nocgo $(go list -tags nocgo ./... | grep -v /internal/ui)

      - name: build the release files
        run: scripts/release.sh "$GITHUB_REF_NAME" dist

      # sha256sums.txt signed with the key install.sh pins, a release
      # without the key stops here
      - name: sign the checksums
        env:
          SSHR_RELEASE_KEY: ${{ secrets.SSHR_RELEASE_KEY }}
        run: scripts/sign-release.sh dist "$GITHUB_REF_NAME"

      - name: attest the files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
