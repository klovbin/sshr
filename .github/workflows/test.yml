name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # go vet and known vulnerabilities in the dependencies, once on Linux, the
  # code is the same on every system
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet -tags nocgo $(go list -tags nocgo ./... | grep -v /internal/ui)
      - name: govulncheck
        env:
          CGO_ENABLED: "0"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags nocgo $(go list -tags nocgo ./... | grep -v /internal/ui)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the GUI package needs cgo and, on Linux, Wayland/X11 and Vulkan
      # headers, it is built below
      - name: tests
        env:
          CGO_ENABLED: "0"
        run: go test -tags nocgo $(go list -tags nocgo ./... | grep -v /internal/ui)

      - name: build the CLI
        env:
          CGO_ENABLED: "0"
        run: go build -tags nocgo -o cli/ ./cmd/sshr

      # gio needs cgo and on Linux the Wayland, X11, EGL and Vulkan headers,
      # the list of gio's own CI
      - name: GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libvulkan-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev >/dev/null

      - name: build the GUI
        run: go build -o gui/ ./cmd/sshr

      - name: CLI smoke test
        run: |
          set -x
          ./cli/sshr help
          ./cli/sshr add 127.0.0.1 -u ci -n local -p 1 --ask-password
          ./cli/sshr list --ping
          if ./cli/sshr ping local; then echo "a closed port answered"; exit 1; fi
          ./cli/sshr export-ssh-config
          ./cli/sshr rm local

      - name: connect to a local sshd
        if: runner.os != 'Windows'
        run: .github/e2e.sh

      - name: app bundle
        if: runner.os == 'macOS'
        run: |
          ./gui/sshr desktop-entry
          app="$HOME/Applications/sshr.app"
          test -x "$app/Contents/MacOS/sshr"
          file "$app/Contents/Resources/sshr.icns" | grep -q "Mac OS X icon"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --verbose "$app"
          "$app/Contents/MacOS/sshr" help >/dev/null
          ./gui/sshr desktop-entry --remove
          test ! -e "$app"
